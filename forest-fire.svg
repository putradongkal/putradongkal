<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2226"/>
      <stop offset="0.55" stop-color="#7a3a26"/>
      <stop offset="1" stop-color="#d4692e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a20"/>
      <stop offset="1" stop-color="#1b1411"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="300" rx="16"/></clipPath>

    <!-- trees -->
    <g id="tree">
      <rect x="-4" y="-20" width="8" height="20" fill="#4a2f1b"/>
      <polygon points="-26,-18 0,-62 26,-18" fill="#2f6b3a"/>
      <polygon points="-22,-44 0,-86 22,-44" fill="#2a5f34"/>
      <polygon points="-16,-70 0,-108 16,-70" fill="#245430"/>
    </g>
    <g id="burnt">
      <rect x="-4" y="-20" width="8" height="20" fill="#2a1a12"/>
      <polygon points="-26,-18 0,-62 26,-18" fill="#2b2420"/>
      <polygon points="-22,-44 0,-86 22,-44" fill="#231d1a"/>
      <polygon points="-16,-70 0,-108 16,-70" fill="#1c1715"/>
    </g>

    <!-- flame -->
    <g id="flame">
      <path d="M0 0 C-14 -8 -16 -26 0 -52 C3 -34 16 -28 13 -12 C11 -5 5 0 0 0Z" fill="#ff5a14"/>
      <path d="M0 0 C-8 -5 -9 -16 0 -32 C2 -20 9 -17 7 -8 C6 -3 3 0 0 0Z" fill="#ffc43d"/>
    </g>

    <!-- person: origin at feet -->
    <g id="person-base">
      <g transform="translate(0,-22)">
        <line class="leg a" x1="0" y1="0" x2="0" y2="22" stroke="#26303f" stroke-width="5" stroke-linecap="round"/>
        <line class="leg b" x1="0" y1="0" x2="0" y2="22" stroke="#1b2330" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g transform="translate(0,-40)">
        <line class="arm b" x1="0" y1="0" x2="0" y2="16" stroke="#d9a47a" stroke-width="4" stroke-linecap="round"/>
      </g>
      <rect x="-7" y="-42" width="14" height="22" rx="5"/>
      <g transform="translate(0,-40)">
        <line class="arm a" x1="0" y1="0" x2="0" y2="16" stroke="#d9a47a" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle cx="0" cy="-50" r="8" fill="#e0ac84"/>
      <path d="M-8 -52 Q-8 -60 0 -60 Q8 -60 8 -52 Q4 -56 0 -56 Q-4 -56 -8 -52Z" fill="#2a1d18"/>
      <circle cx="2" cy="-52" r="1.2" fill="#222"/>
      <circle cx="6" cy="-52" r="1.2" fill="#222"/>
      <line x1="-8" y1="-49" x2="-5" y2="-48" stroke="#cfe8f5" stroke-width="1"/>
      <rect x="0" y="-49" width="10" height="6" rx="2" fill="#cfeaff" stroke="#8cc3e6" stroke-width="0.8"/>
    </g>
  </defs>

  <style>
    .f { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 0.7s ease-in-out infinite alternate; }
    .f2 { animation-duration: 0.55s; animation-delay: -0.2s; }
    .f3 { animation-duration: 0.85s; animation-delay: -0.4s; }
    .smoke { transform-box: fill-box; transform-origin: center; fill: #6b625d; opacity: 0; animation: rise 9s linear infinite; }
    .ember { fill: #ffb347; opacity: 0; animation: ember 4s ease-out infinite; }
    .glow { animation: pulse 2.4s ease-in-out infinite alternate; }
    .haze { animation: haze 7s ease-in-out infinite alternate; }
    .walker { animation: walk 18s linear infinite; }
    .bob { animation: bob 0.5s ease-in-out infinite alternate; }
    .leg { animation: swing 0.9s ease-in-out infinite alternate; }
    .leg.b, .arm.a { animation-direction: alternate-reverse; }
    .arm { animation: swing 0.9s ease-in-out infinite alternate; }
    .caption { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #f5e6d3; opacity: 0.9; }

    @keyframes flick {
      from { transform: scale(0.9, 0.85) skewX(-3deg); opacity: 0.95; }
      to   { transform: scale(1.08, 1.2) skewX(4deg); opacity: 1; }
    }
    @keyframes rise {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
      15%  { opacity: 0.55; }
      100% { opacity: 0; transform: translate(90px, -170px) scale(2.8); }
    }
    @keyframes ember {
      0%   { opacity: 0; transform: translate(0, 0); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translate(30px, -130px); }
    }
    @keyframes pulse { from { opacity: 0.55; } to { opacity: 1; } }
    @keyframes haze  { from { opacity: 0.18; } to { opacity: 0.38; } }
    @keyframes walk {
      0%   { transform: translateX(0); opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { transform: translateX(430px); opacity: 0; }
    }
    @keyframes bob   { from { transform: translateY(0); } to { transform: translateY(-2px); } }
    @keyframes swing { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
  </style>

  <g clip-path="url(#round)">
    <!-- sky and sun behind haze -->
    <rect width="900" height="300" fill="url(#sky)"/>
    <circle cx="700" cy="95" r="34" fill="#f3b27a" opacity="0.55"/>
    <rect class="glow" x="0" y="0" width="560" height="300" fill="url(#glow)"/>

    <!-- distant hills -->
    <path d="M0 200 Q120 160 250 195 T520 185 T900 205 V300 H0Z" fill="#3a2522" opacity="0.8"/>

    <!-- smoke -->
    <circle class="smoke" cx="60"  cy="140" r="26" style="animation-delay:0s"/>
    <circle class="smoke" cx="140" cy="120" r="32" style="animation-delay:-1.5s"/>
    <circle class="smoke" cx="220" cy="135" r="28" style="animation-delay:-3s"/>
    <circle class="smoke" cx="300" cy="115" r="34" style="animation-delay:-4.5s"/>
    <circle class="smoke" cx="380" cy="130" r="26" style="animation-delay:-6s"/>
    <circle class="smoke" cx="170" cy="150" r="30" style="animation-delay:-7.5s"/>
    <circle class="smoke" cx="330" cy="145" r="30" style="animation-delay:-2.2s"/>

    <!-- ground -->
    <rect y="252" width="900" height="48" fill="url(#ground)"/>

    <!-- forest -->
    <use href="#burnt" transform="translate(40,252) scale(1.1)"/>
    <use href="#tree"  transform="translate(105,252) scale(0.95)"/>
    <use href="#burnt" transform="translate(170,252) scale(1.2)"/>
    <use href="#burnt" transform="translate(240,252)"/>
    <use href="#tree"  transform="translate(305,252) scale(1.1)"/>
    <use href="#burnt" transform="translate(370,252) scale(0.9)"/>
    <use href="#tree"  transform="translate(430,252) scale(0.8)"/>

    <!-- flames -->
    <g transform="translate(40,160) scale(1.3)"><use class="f" href="#flame"/></g>
    <g transform="translate(40,215) scale(1.1)"><use class="f f2" href="#flame"/></g>
    <g transform="translate(105,175) scale(1.1)"><use class="f f3" href="#flame"/></g>
    <g transform="translate(170,140) scale(1.6)"><use class="f f2" href="#flame"/></g>
    <g transform="translate(170,215) scale(1.2)"><use class="f" href="#flame"/></g>
    <g transform="translate(240,170) scale(1.4)"><use class="f f3" href="#flame"/></g>
    <g transform="translate(240,230) scale(1)"><use class="f f2" href="#flame"/></g>
    <g transform="translate(305,165) scale(1.2)"><use class="f" href="#flame"/></g>
    <g transform="translate(370,185) scale(1.2)"><use class="f f2" href="#flame"/></g>
    <g transform="translate(430,205) scale(0.9)"><use class="f f3" href="#flame"/></g>
    <g transform="translate(135,252) scale(1.5)"><use class="f" href="#flame"/></g>
    <g transform="translate(205,252) scale(1.8)"><use class="f f2" href="#flame"/></g>
    <g transform="translate(275,252) scale(1.4)"><use class="f f3" href="#flame"/></g>
    <g transform="translate(340,252) scale(1.6)"><use class="f" href="#flame"/></g>
    <g transform="translate(400,252) scale(1.3)"><use class="f f2" href="#flame"/></g>

    <!-- embers -->
    <circle class="ember" cx="100" cy="150" r="2" style="animation-delay:0s"/>
    <circle class="ember" cx="190" cy="120" r="2.4" style="animation-delay:-1s"/>
    <circle class="ember" cx="260" cy="150" r="2" style="animation-delay:-2s"/>
    <circle class="ember" cx="330" cy="140" r="2.2" style="animation-delay:-3s"/>
    <circle class="ember" cx="390" cy="170" r="1.8" style="animation-delay:-1.6s"/>
    <circle class="ember" cx="60" cy="170" r="2" style="animation-delay:-2.6s"/>

    <!-- people with masks (walking away from the fire) -->
    <g transform="translate(450,268)">
      <g class="walker" style="animation-delay:0s"><g class="bob"><use href="#person-base" fill="#ef4444"/></g></g>
    </g>
    <g transform="translate(450,260) scale(0.92)">
      <g class="walker" style="animation-delay:-4.5s"><g class="bob"><use href="#person-base" fill="#3b82f6"/></g></g>
    </g>
    <g transform="translate(450,272) scale(1.05)">
      <g class="walker" style="animation-delay:-9s"><g class="bob"><use href="#person-base" fill="#22c55e"/></g></g>
    </g>
    <g transform="translate(450,264) scale(0.85)">
      <g class="walker" style="animation-delay:-13.5s"><g class="bob"><use href="#person-base" fill="#f59e0b"/></g></g>
    </g>

    <!-- smoky haze over everything -->
    <rect class="haze" width="900" height="300" fill="#b9a48a"/>

    <text class="caption" x="880" y="28" text-anchor="end">Selamatkan hutan · Pakai masker saat kabut asap</text>
  </g>
</svg>
